
{% extends "base.html" %}

{% block title %}
Nova Solicitação
{% endblock %}

{% block content %}

<div class="container">

    <div class="card shadow-sm">

        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">Cadastrar Nova Solicitação</h4>
        </div>

        <div class="card-body">

            {% if erro %}
                <div class="alert alert-danger">
                    {{ erro }}
                </div>
            {% endif %}

            <form
                action="{{ url_for('main.Nova_solicitacao') }}"
                method="POST">

                <!--Solicitação -->
                <div class="mb-3">
                    <label for="subject" class="form-label">
                        Descrição da solicitação
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="subject"
                        name="subject"
                        placeholder="Ex: Manutenção, Instalação..."
                        required>
                </div>

                <!-- Urgência -->
                <div class="mb-3">
                     <label class="form-label">
                        Prioridade
                    </label>

                    <select name="prioridade" class="form-select">

                        <option value="0">Baixa</option>
                        <option value="1">Média</option>
                        <option value="2">Alta</option>
                        <option value="3">Urgente</option>

                    </select>

                <!-- Status inicial -->
                <div class="mb-3">
                    <label class="form-label">
                        Status inicial
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        value="Pendente"
                        disabled>
                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary">
                        Cadastrar solicitação
                    </button>

                    <a
                        href="{{ url_for('main.filtro') }}"
                        class="btn btn-secondary">
                        Cancelar
                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
