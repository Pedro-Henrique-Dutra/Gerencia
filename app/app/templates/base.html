
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>{% block title %}Automação{% endblock %}</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">
    <link rel="stylesheet" 
    href="{{ url_for('static', filename='css/style.css') }}">

    <script src="{{ url_for('static', filename='js/reload.js') }}"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand fw-bold">Automação</span>
        <span class="text-white-50">Automação </span>
    </nav>
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="text-white-50">
            <a class="links_sem_decoracao" href="{{ url_for('main.dashboard') }}"> Dashboard |</a>
            <a class="links_sem_decoracao" href="{{ url_for('main.Nova_solicitacao') }}"> Nova solicitação |</a>
             
        </span>

        <form action="{{ url_for('main.filtro') }}"
          method="GET"
          class="d-flex ms-auto"
          role="search">

        <input
            class="form-control me-2"
            type="search"
            name="tipo_solicitacao"
            placeholder="Pesquisar solicitação..."
            value="{{ request.args.get('tipo_solicitacao', '') }}"
            aria-label="Pesquisar">

        <button class="btn btn-outline-light"
                type="submit">
            🔍
        </button>

    </form>
    
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
